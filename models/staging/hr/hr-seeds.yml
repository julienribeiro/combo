          - not_null
      - name: user_contract_end_date
        description: "{{ doc('contract_end_date') }}"
      - name: user_contract_end_trial_date
        description: "{{ doc('user_contract_end_trial_date') }}"
      - name: user_contract_invitation_sent_at
        description: "{{ doc('user_contract_invitation_sent_at') }}"
      - name: user_contract_invitation_accepted_at
        description: "{{ doc('user_contract_invitation_accepted_at') }}"
      - name: user_contract_start_at
        description: "{{ doc('user_contract_start_at') }}"
      - name: user_contract_type
        description: "{{ doc('contract_type') }}"
      - name: user_contract_time
        description: "{{ doc('contract_time') }}"
      - name: user_contract_end_reason
        description: "{{ doc('user_contract_end_reason') }}"
      - name: user_contract_lastname
        description: "{{ doc('lastname') }}"
      - name: user_contract_firstname
        description: "{{ doc('firstname') }}"
      - name: user_contract_address
        description: "{{ doc('address') }}"
      - name: user_contract_birth_department_code
        description: "{{ doc('user_contract_birth_department_code') }}"
      - name: user_contract_object_type
        description: "{{ doc('user_contract_object_type') }}"
      - name: user_contract_working_days_in_week
        description: "{{ doc('user_contract_working_days_in_week') }}"
      - name: is_user_contract_daily_worker
        description: "{{ doc('is_user_contract_daily_worker') }}"
