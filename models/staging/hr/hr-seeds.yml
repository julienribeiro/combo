        tests:
          - not_null
      - name: location_id
        description: "{{ doc('location_id') }}"
        tests:
          - not_null
      - name: account_id
        description: "{{ doc('account_id') }}"
        tests:
          - not_null
      - name: user_contract_team_id
        description: "{{ doc('team_id') }}"
      - name: user_contract_partner_id
