version: 2

models:
  - name: mart_planning_events_weekly_exploded
    description: Planning events exploded at weekly grain (1 row per event per week_start_date, week starting on Monday).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - event_id
              - week_start_date
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        tests:
          - not_null
      - name: user_contract_id
        description: "{{ doc('user_contract_id') }}"
        tests:
          - not_null
      - name: location_id
        description: "{{ doc('location_id') }}"
        tests:
          - not_null
      - name: account_id
        description: "{{ doc('account_id') }}"
        tests:
          - not_null
      - name: event_type
        description: "{{ doc('event_type') }}"
        tests:
          - not_null
      - name: week_start_date
        description: "{{ doc('week_start_date') }}"
        tests:
          - not_null