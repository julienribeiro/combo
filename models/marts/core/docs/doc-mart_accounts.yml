version: 2

models:
  - name: mart_accounts
    description: All accounts.
    columns:
      - name: account_id
        description: "{{ doc('account_id') }}"
        tests:
          - unique
          - not_null
      - name: partner_id
        description: "{{ doc('partner_id') }}"
        tests:
          - not_null
      - name: account_collective_agreement_id
        description: "{{ doc('collective_agreement_id') }}"
        tests:
          - not_null
      - name: account_payroll_software_id
        description: "{{ doc('payroll_software_id') }}"
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['default', 'paie_rh', 'payfit', 'quadra_paie', 'silae']
      - name: account_name
        description: "{{ doc('account_name') }}"
        tests:
          - not_null
      - name: account_created_at
        description: "{{ doc('created_at') }}"
        tests:
          - not_null
      - name: account_updated_at
        description: "{{ doc('updated_at') }}"
      - name: account_timezone
        description: "{{ doc('timezone') }}"
        tests:
          - not_null
      - name: account_default_language
        description: "{{ doc('account_default_language') }}"
        tests:
          - not_null
      - name: account_street
        description: "{{ doc('street') }}"
      - name: account_zipcode
        description: "{{ doc('zipcode') }}"
      - name: account_city
        description: "{{ doc('city') }}"
      - name: account_country
        description: "{{ doc('country') }}"
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['FR', 'ES', 'BE', 'NC']
      - name: account_sheet_hour_cut
        description: "{{ doc('sheet_hour_cut') }}"
      - name: account_social_tax
        description: "{{ doc('social_tax') }}"
      - name: has_account_paid_breaks
        description: "{{ doc('has_account_paid_breaks') }}"
      - name: is_account_showing_real_and_planned_hours_on_planning
