version: 2

models:
  - name: def_week_location_spine
    description: >
      Reference table generating all combinations of week x active location.
      Used as a backbone to ensure the presence of weeks with zero activity
      in billing metrics.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - week_start_date
              - account_id
              - location_id
    columns:
      - name: week_start_date
        description: "{{ doc('week_start_date') }}"
        tests:
          - not_null
      - name: account_id
        description: "{{ doc('account_id') }}"
        tests:
          - not_null
      - name: location_id
        description: "{{ doc('location_id') }}"
        tests:
          - not_null