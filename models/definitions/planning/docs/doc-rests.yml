version: 2

models:
  - name: def_rests
    description: Staging of planned rest periods for employees.
    columns:
      - name: rest_id
        description: "{{ doc('rest_id') }}"
        tests:
          - unique
          - not_null
      - name: user_contract_id
        description: "{{ doc('user_contract_id') }}"
        tests:
          - not_null
      - name: rest_timeoff_id
        description: "{{ doc('rest_timeoff_id') }}"
      - name: rest_original_shift_id
        description: "{{ doc('rest_original_shift_id') }}"
      - name: account_id
        description: "{{ doc('account_id') }}"
        tests:
          - not_null
      - name: partner_id
        description: "{{ doc('partner_id') }}"
      - name: rest_created_at
        description: "{{ doc('created_at') }}"
        tests:
          - not_null
      - name: rest_updated_at
        description: "{{ doc('updated_at') }}"
      - name: rest_start_at
        description: "{{ doc('start_at') }}"
        tests:
          - not_null
      - name: rest_end_at
        description: "{{ doc('end_at') }}"
        tests:
          - not_null
      - name: rest_type
        description: "{{ doc('rest_type') }}"